name: CI

on:
  push:
    branches: [main, 'build/**', 'fix/**', 'feat/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:event
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
